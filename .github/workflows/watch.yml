name: ticket watch

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      rsc_probe:
        description: 'Manual diagnostic only: RSC cloud booking page did not load; not an active monitor'
        type: boolean
        default: false
      hebe_probe:
        description: 'Manual diagnostic only: Ticket Plus blocks cloud public reads; Hebe is not active'
        type: boolean
        default: false
      jcs_probe:
        description: 'Manual diagnostic only: LW currently rejects the cloud browser; not an active ticket monitor'
        type: boolean
        default: false

concurrency:
  group: eurotrash-ticket-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    # Standard public-repository Linux runner: no paid services or large runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test theatre monitors
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_scheduler.cjs
      - name: Check Suranne Jones exact An Oak Tree performance
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: python3 an_oak_tree.py
      - name: Check Virginia Woolf all future performances
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: xvfb-run -a python3 virginia_woolf.py
      - name: Check Bush Theatre The Hungry Ghost official availability
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: python3 hungry_ghost.py
      - name: Diagnose RSC As You Like It November 6-7 (not active)
        if: ${{ !cancelled() && inputs.rsc_probe == true }}
        env:
          RSC_DIAGNOSTIC: 'true'
        run: xvfb-run -a python3 rsc_as_you_like_it.py
      - name: Diagnose Hebe Ticket Plus cloud access (not active)
        if: ${{ !cancelled() && inputs.hebe_probe == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: python3 hebe.py

  jcs:
    # Separate job after the other shows: a slow LW booking site cannot
    # consume their job timeout. Serial state writes avoid branch conflicts.
    needs: check
    if: ${{ always() && !cancelled() && inputs.jcs_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check each JCS 25 pound On-Stage Standing area through October 31
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: xvfb-run -a python3 jcs_on_stage.py
